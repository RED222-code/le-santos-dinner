<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a17"/>
      <stop offset="100%" stop-color="#2c2c26"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f0e6d0"/>
      <stop offset="50%" stop-color="#d4c5a0"/>
      <stop offset="100%" stop-color="#b8a87a"/>
    </linearGradient>
    <linearGradient id="steam1" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#d4c5a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d4c5a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steam2" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#f0e6d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f0e6d0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg-grad)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#gold-grad)" stroke-width="1.2" opacity="0.5"/>

  <!-- Cloche / dome lid -->
  <path d="M16 38 C16 24, 24 17, 32 17 C40 17, 48 24, 48 38" 
        fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Cloche handle knob -->
  <circle cx="32" cy="16" r="2.5" fill="url(#gold-grad)"/>
  
  <!-- Plate / base line -->
  <path d="M13 39 L51 39" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Plate bottom curve -->
  <path d="M15 39 C15 43, 22 46, 32 46 C42 46, 49 43, 49 39" 
        fill="none" stroke="url(#gold-grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Steam wisps -->
  <path d="M25 14 C25 11, 27 10, 25 7" fill="none" stroke="url(#steam1)" stroke-width="1.3" stroke-linecap="round">
    <animate attributeName="d" 
      values="M25 14 C25 11, 27 10, 25 7;M25 14 C23 11, 27 9, 25 6;M25 14 C25 11, 27 10, 25 7" 
      dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M32 13 C32 10, 34 9, 32 5" fill="none" stroke="url(#steam2)" stroke-width="1.3" stroke-linecap="round">
    <animate attributeName="d" 
      values="M32 13 C32 10, 34 9, 32 5;M32 13 C30 10, 34 8, 32 4;M32 13 C32 10, 34 9, 32 5" 
      dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M39 14 C39 11, 41 10, 39 7" fill="none" stroke="url(#steam1)" stroke-width="1.3" stroke-linecap="round">
    <animate attributeName="d" 
      values="M39 14 C39 11, 41 10, 39 7;M39 14 C37 11, 41 9, 39 6;M39 14 C39 11, 41 10, 39 7" 
      dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- LS monogram text -->
  <text x="32" y="35.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" 
        font-size="11" font-weight="bold" font-style="italic" fill="url(#gold-grad)" letter-spacing="1">
    LS
  </text>
</svg>