<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a17"/>
      <stop offset="100%" stop-color="#2c2c26"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f0e6d0"/>
      <stop offset="50%" stop-color="#d4c5a0"/>
      <stop offset="100%" stop-color="#b8a87a"/>
    </linearGradient>
    <linearGradient id="steam1" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#d4c5a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d4c5a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steam2" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#f0e6d0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0e6d0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg-grad)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Steam wisps -->
  <path d="M23 17 C23 13, 25.5 11, 23 7" fill="none" stroke="url(#steam1)" stroke-width="1.8" stroke-linecap="round">
    <animate attributeName="d" 
      values="M23 17 C23 13, 25.5 11, 23 7;M23 17 C21 13, 25.5 9, 23 5;M23 17 C23 13, 25.5 11, 23 7" 
      dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M32 15 C32 11, 34.5 9, 32 4" fill="none" stroke="url(#steam2)" stroke-width="1.8" stroke-linecap="round">
    <animate attributeName="d" 
      values="M32 15 C32 11, 34.5 9, 32 4;M32 15 C30 11, 34.5 7, 32 3;M32 15 C32 11, 34.5 9, 32 4" 
      dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M41 17 C41 13, 43.5 11, 41 7" fill="none" stroke="url(#steam1)" stroke-width="1.8" stroke-linecap="round">
    <animate attributeName="d" 
      values="M41 17 C41 13, 43.5 11, 41 7;M41 17 C39 13, 43.5 9, 41 5;M41 17 C41 13, 43.5 11, 41 7" 
      dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- Cloche dome - bigger and bolder -->
  <path d="M12 42 C12 26, 21 18, 32 18 C43 18, 52 26, 52 42" 
        fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cloche handle knob -->
  <circle cx="32" cy="17" r="3" fill="url(#gold-grad)"/>
  
  <!-- Plate base line -->
  <path d="M9 43 L55 43" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Plate bottom curve -->
  <path d="M12 43 C12 48, 20 51, 32 51 C44 51, 52 48, 52 43" 
        fill="none" stroke="url(#gold-grad)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

  <!-- LS monogram text - bigger -->
  <text x="32" y="39" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" 
        font-size="14" font-weight="bold" font-style="italic" fill="url(#gold-grad)" letter-spacing="1.5">
    LS
  </text>
</svg>